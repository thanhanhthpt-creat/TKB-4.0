[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tkb"
version = "0.2.0"
description = "Ứng dụng hỗ trợ lập thời khóa biểu tiểu học"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "AI-TKB contributors"}]
dependencies = [
  "PySide6>=6.7,<7",
  "openpyxl>=3.1,<4",
  "ortools>=9.10,<10",
  "pdfplumber>=0.11,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
  "pyinstaller>=6.8,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
